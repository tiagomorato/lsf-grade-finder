name: Check Grades

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Restore grades data
        uses: actions/cache/restore@v4
        with:
          path: data/grades.json
          key: grades-data

      - name: Check for new grades
        env:
          LSF_BASE_URL: ${{ secrets.LSF_BASE_URL }}
          LSF_USERNAME: ${{ secrets.LSF_USERNAME }}
          LSF_PASSWORD: ${{ secrets.LSF_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m src.main

      - name: Save grades data
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/grades.json
          key: grades-data-${{ github.run_id }}
